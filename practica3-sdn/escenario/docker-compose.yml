# ============================================================================
#  docker-compose.yml  -  GENERADO por desplegar_red.py
#  (no editar a mano: cambia el script y ejecuta 'python3 desplegar_red.py generar')
#
#                          [ servidor ]  .10
#                                |          VLAN100   10.31.100.0/24
#                            .1 (R1)
#                                | .1       enlace    10.31.255.0/29
#                            .2 (R2)
#                     .9 +-------+-------+ .17
#                        |               |  enlaces   10.31.255.8/29  (R2-R3)
#                    .10 |               | .18        10.31.255.16/29 (R2-R4)
#                      (R3)            (R4)
#                   .1 /   \ .1     .1 /   \ .1
#            [SW VLAN10] [SW VLAN20] [SW VLAN30] [SW VLAN40]
#               RED 1       RED 2       RED 3       RED 4
#            .10.0/24    .20.0/24    .30.0/24    .40.0/24
#            (prefijo 10.31; PCs desde la .10)
#
#  Enrutamiento: rutas estaticas con FRR (Free Range Routing)
#  Logs: fluentd recoge el log de FRR de cada router y la salida de los contenedores
# ============================================================================
version: "2.4"   # solo por compatibilidad con docker-compose v1; Compose v2 lo ignora

services:

  # ------------------------------------------------------------------------
  # fluentd: servicio de soporte (no forma parte del mapa de red).
  # Lee el log de FRR de cada router (volumen compartido) y recibe la salida
  # de los contenedores a traves del driver de logging de Docker (puerto 24224).
  fluentd:
    image: fluent/fluentd:v1.20-debian-1
    container_name: fluentd
    hostname: fluentd
    user: root                       
    volumes:
      - ./fluentd/conf:/fluentd/etc:ro            # fluent.conf
      - ./fluentd/shared-volume:/shared-volume    # logs de FRR de los routers
      - ./fluentd/output:/fluentd/output          # datos recogidos
    ports:
      - "127.0.0.1:24224:24224"     # aqui envia Docker la salida de los contenedores
    networks:
      gestion:
        ipv4_address: 10.31.200.10
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # R1 - router del servidor
  #   10.31.100.1     10.31.100.0/24     LAN del servidor (CPD)
  #   10.31.255.1     10.31.255.0/29     Enlace R1-R2
  r1:
    build: ./router
    container_name: R1
    hostname: R1
    privileged: true                 # zebra (FRR) instala rutas en el kernel
    init: true
    sysctls:
      net.ipv4.ip_forward: 1         # el contenedor reenvia paquetes: es un router
    environment:
      ROUTER_NAME: R1
      OSPF: "no"
      DESCRIPCIONES: "10.31.100.1=LAN-servidor-VLAN100 10.31.255.1=enlace-R1-R2"
    volumes:
      - ./config/R1:/config:ro                  # frr.conf de este router
      - ./fluentd/shared-volume:/shared-volume  # FRR escribe aqui su log (lo lee fluentd)
    depends_on:
      - fluentd
    logging:                        # salida del contenedor -> fluentd
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "docker.R1"
    networks:
      vlan100_servidor:
        ipv4_address: 10.31.100.1
      enlace_r1_r2:
        ipv4_address: 10.31.255.1
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # R2 - router de nucleo
  #   10.31.255.2     10.31.255.0/29     Enlace R1-R2
  #   10.31.255.9     10.31.255.8/29     Enlace R2-R3
  #   10.31.255.17    10.31.255.16/29    Enlace R2-R4
  r2:
    build: ./router
    container_name: R2
    hostname: R2
    privileged: true                 # zebra (FRR) instala rutas en el kernel
    init: true
    sysctls:
      net.ipv4.ip_forward: 1         # el contenedor reenvia paquetes: es un router
    environment:
      ROUTER_NAME: R2
      OSPF: "no"
      DESCRIPCIONES: "10.31.255.2=enlace-R1-R2 10.31.255.9=enlace-R2-R3 10.31.255.17=enlace-R2-R4"
    volumes:
      - ./config/R2:/config:ro                  # frr.conf de este router
      - ./fluentd/shared-volume:/shared-volume  # FRR escribe aqui su log (lo lee fluentd)
    depends_on:
      - fluentd
    logging:                        # salida del contenedor -> fluentd
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "docker.R2"
    networks:
      enlace_r1_r2:
        ipv4_address: 10.31.255.2
      enlace_r2_r3:
        ipv4_address: 10.31.255.9
      enlace_r2_r4:
        ipv4_address: 10.31.255.17
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # R3 - router de acceso de RED 1 y RED 2
  #   10.31.255.10    10.31.255.8/29     Enlace R2-R3
  #   10.31.10.1      10.31.10.0/24      RED 1
  #   10.31.20.1      10.31.20.0/24      RED 2
  r3:
    build: ./router
    container_name: R3
    hostname: R3
    privileged: true                 # zebra (FRR) instala rutas en el kernel
    init: true
    sysctls:
      net.ipv4.ip_forward: 1         # el contenedor reenvia paquetes: es un router
    environment:
      ROUTER_NAME: R3
      OSPF: "no"
      DESCRIPCIONES: "10.31.255.10=enlace-R2-R3 10.31.10.1=RED1-VLAN10 10.31.20.1=RED2-VLAN20"
    volumes:
      - ./config/R3:/config:ro                  # frr.conf de este router
      - ./fluentd/shared-volume:/shared-volume  # FRR escribe aqui su log (lo lee fluentd)
    depends_on:
      - fluentd
    logging:                        # salida del contenedor -> fluentd
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "docker.R3"
    networks:
      enlace_r2_r3:
        ipv4_address: 10.31.255.10
      vlan10_red1:
        ipv4_address: 10.31.10.1
      vlan20_red2:
        ipv4_address: 10.31.20.1
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # R4 - router de acceso de RED 3 y RED 4
  #   10.31.255.18    10.31.255.16/29    Enlace R2-R4
  #   10.31.30.1      10.31.30.0/24      RED 3
  #   10.31.40.1      10.31.40.0/24      RED 4
  r4:
    build: ./router
    container_name: R4
    hostname: R4
    privileged: true                 # zebra (FRR) instala rutas en el kernel
    init: true
    sysctls:
      net.ipv4.ip_forward: 1         # el contenedor reenvia paquetes: es un router
    environment:
      ROUTER_NAME: R4
      OSPF: "no"
      DESCRIPCIONES: "10.31.255.18=enlace-R2-R4 10.31.30.1=RED3-VLAN30 10.31.40.1=RED4-VLAN40"
    volumes:
      - ./config/R4:/config:ro                  # frr.conf de este router
      - ./fluentd/shared-volume:/shared-volume  # FRR escribe aqui su log (lo lee fluentd)
    depends_on:
      - fluentd
    logging:                        # salida del contenedor -> fluentd
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "docker.R4"
    networks:
      enlace_r2_r4:
        ipv4_address: 10.31.255.18
      vlan30_red3:
        ipv4_address: 10.31.30.1
      vlan40_red4:
        ipv4_address: 10.31.40.1
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # Servidor web: al arrancar clona SSR-master-server de GitHub, instala sus
  # dependencias con npm y lo ejecuta con Node.js en el puerto 3000.
  servidor:
    build: ./servidor
    container_name: servidor
    hostname: servidor
    init: true
    cap_add:
      - NET_ADMIN                    # para anadir la ruta hacia las redes de la practica
    environment:
      REPO_URL: "https://github.com/gisai/SSR-master-server.git"
      RED_INTERNA: "10.31.0.0/16"            # todas las redes de la practica...
      ROUTER: "10.31.100.1"                # ...se alcanzan a traves de R1
    ports:
      - "3000:3000"                    # acceso desde el anfitrion: http://localhost:3000
    depends_on:
      - fluentd
      - r1
    logging:                        # salida del contenedor -> fluentd
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "docker.servidor"
    healthcheck:                     # 'healthy' cuando responde la web
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      vlan100_servidor:
        ipv4_address: 10.31.100.10
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # red1-pc1 - PC de RED 1 (switch VLAN10), puerta de enlace 10.31.10.1 (R3)
  red1-pc1:
    build: ./host
    container_name: red1-pc1
    hostname: red1-pc1
    init: true
    cap_add:
      - NET_ADMIN                    # para cambiar la ruta por defecto
    environment:
      GATEWAY: "10.31.10.1"
    extra_hosts:
      - "servidor:10.31.100.10"        # resolucion del nombre del servidor
    depends_on:
      - r3
    networks:
      vlan10_red1:
        ipv4_address: 10.31.10.10
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # red2-pc1 - PC de RED 2 (switch VLAN20), puerta de enlace 10.31.20.1 (R3)
  red2-pc1:
    build: ./host
    container_name: red2-pc1
    hostname: red2-pc1
    init: true
    cap_add:
      - NET_ADMIN                    # para cambiar la ruta por defecto
    environment:
      GATEWAY: "10.31.20.1"
    extra_hosts:
      - "servidor:10.31.100.10"        # resolucion del nombre del servidor
    depends_on:
      - r3
    networks:
      vlan20_red2:
        ipv4_address: 10.31.20.10
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # red3-pc1 - PC de RED 3 (switch VLAN30), puerta de enlace 10.31.30.1 (R4)
  red3-pc1:
    build: ./host
    container_name: red3-pc1
    hostname: red3-pc1
    init: true
    cap_add:
      - NET_ADMIN                    # para cambiar la ruta por defecto
    environment:
      GATEWAY: "10.31.30.1"
    extra_hosts:
      - "servidor:10.31.100.10"        # resolucion del nombre del servidor
    depends_on:
      - r4
    networks:
      vlan30_red3:
        ipv4_address: 10.31.30.10
    restart: unless-stopped

  # ------------------------------------------------------------------------
  # red4-pc1 - PC de RED 4 (switch VLAN40), puerta de enlace 10.31.40.1 (R4)
  red4-pc1:
    build: ./host
    container_name: red4-pc1
    hostname: red4-pc1
    init: true
    cap_add:
      - NET_ADMIN                    # para cambiar la ruta por defecto
    environment:
      GATEWAY: "10.31.40.1"
    extra_hosts:
      - "servidor:10.31.100.10"        # resolucion del nombre del servidor
    depends_on:
      - r4
    networks:
      vlan40_red4:
        ipv4_address: 10.31.40.10
    restart: unless-stopped

# ============================================================================
# Redes. Cada switch con VLAN del dibujo es una red bridge de Docker
# independiente (un dominio de difusion aislado = una VLAN); su bridge en el
# anfitrion se llama br-vlanXX. La ultima IP util de cada subred es la del
# anfitrion Docker (gateway), para dejar la .1 libre para el router.
#
# gateway_mode_ipv4=nat-unprotected: desde Docker 28, Docker descarta los paquetes
# dirigidos a la IP de un contenedor que entran por un bridge distinto del suyo
# (reglas 'raw' DIRECT ACCESS FILTERING). Eso rompe el trafico que encaminan los
# routers de la practica. Este modo mantiene el NAT pero no crea esas reglas.
# (Docker 27 no acepta este valor: regenera con --docker-antiguo.)
# ============================================================================
networks:
  vlan100_servidor:                     # LAN del servidor (CPD) (VLAN 100)
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-vlan100
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.100.0/24
          gateway: 10.31.100.254
  enlace_r1_r2:                     # Enlace R1-R2
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-r1-r2
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.255.0/29
          gateway: 10.31.255.6
  enlace_r2_r3:                     # Enlace R2-R3
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-r2-r3
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.255.8/29
          gateway: 10.31.255.14
  enlace_r2_r4:                     # Enlace R2-R4
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-r2-r4
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.255.16/29
          gateway: 10.31.255.22
  vlan10_red1:                     # RED 1 (VLAN 10)
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-vlan10
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.10.0/24
          gateway: 10.31.10.254
  vlan20_red2:                     # RED 2 (VLAN 20)
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-vlan20
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.20.0/24
          gateway: 10.31.20.254
  vlan30_red3:                     # RED 3 (VLAN 30)
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-vlan30
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.30.0/24
          gateway: 10.31.30.254
  vlan40_red4:                     # RED 4 (VLAN 40)
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-vlan40
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.40.0/24
          gateway: 10.31.40.254
  gestion:                     # Red de gestion (fluentd), no enrutada
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-gestion
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 10.31.200.0/24
          gateway: 10.31.200.254
