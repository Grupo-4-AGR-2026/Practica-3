! ======================================================================
! FRR (Free Range Routing) - R1: router del servidor
! Generado por desplegar_red.py. Se copia a /etc/frr/frr.conf al arrancar.
! ======================================================================
frr defaults traditional
hostname R1
!
! Log en el volumen compartido con fluentd, con milisegundos
log file /shared-volume/frr/R1.log debugging
log timestamp precision 3
!
banner motd line R1 - router del servidor - Practica SDN con Docker (AGR)
!
! Depuracion de zebra: deja en el log las altas y bajas de rutas
debug zebra events
debug zebra rib
!
ip forwarding
!
! Redes directamente conectadas:
!   10.31.100.0/24     10.31.100.1     LAN del servidor (CPD)
!   10.31.255.0/29     10.31.255.1     Enlace R1-R2
!
! Rutas estaticas:  ip route <red destino> <siguiente salto>
! -> RED 1 (por R2)
ip route 10.31.10.0/24 10.31.255.2
! -> RED 2 (por R2)
ip route 10.31.20.0/24 10.31.255.2
! -> RED 3 (por R2)
ip route 10.31.30.0/24 10.31.255.2
! -> RED 4 (por R2)
ip route 10.31.40.0/24 10.31.255.2
! -> Enlace R2-R3 (por R2)
ip route 10.31.255.8/29 10.31.255.2
! -> Enlace R2-R4 (por R2)
ip route 10.31.255.16/29 10.31.255.2
!
line vty
!
