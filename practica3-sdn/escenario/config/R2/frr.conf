! ======================================================================
! FRR (Free Range Routing) - R2: router de nucleo
! Generado por desplegar_red.py. Se copia a /etc/frr/frr.conf al arrancar.
! ======================================================================
frr defaults traditional
hostname R2
!
! Log en el volumen compartido con fluentd, con milisegundos
log file /shared-volume/frr/R2.log debugging
log timestamp precision 3
!
banner motd line R2 - router de nucleo - Practica SDN con Docker (AGR)
!
! Depuracion de zebra: deja en el log las altas y bajas de rutas
debug zebra events
debug zebra rib
!
ip forwarding
!
! Redes directamente conectadas:
!   10.31.255.0/29     10.31.255.2     Enlace R1-R2
!   10.31.255.8/29     10.31.255.9     Enlace R2-R3
!   10.31.255.16/29    10.31.255.17    Enlace R2-R4
!
! Rutas estaticas:  ip route <red destino> <siguiente salto>
! -> RED 1 (por R3)
ip route 10.31.10.0/24 10.31.255.10
! -> RED 2 (por R3)
ip route 10.31.20.0/24 10.31.255.10
! -> RED 3 (por R4)
ip route 10.31.30.0/24 10.31.255.18
! -> RED 4 (por R4)
ip route 10.31.40.0/24 10.31.255.18
! -> LAN del servidor (CPD) (por R1)
ip route 10.31.100.0/24 10.31.255.1
!
line vty
!
