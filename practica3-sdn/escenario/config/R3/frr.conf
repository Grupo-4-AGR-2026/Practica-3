! ======================================================================
! FRR (Free Range Routing) - R3: router de acceso de RED 1 y RED 2
! Generado por desplegar_red.py. Se copia a /etc/frr/frr.conf al arrancar.
! ======================================================================
frr defaults traditional
hostname R3
!
! Log en el volumen compartido con fluentd, con milisegundos
log file /shared-volume/frr/R3.log debugging
log timestamp precision 3
!
banner motd line R3 - router de acceso de RED 1 y RED 2 - Practica SDN con Docker (AGR)
!
! Depuracion de zebra: deja en el log las altas y bajas de rutas
debug zebra events
debug zebra rib
!
ip forwarding
!
! Redes directamente conectadas:
!   10.31.255.8/29     10.31.255.10    Enlace R2-R3
!   10.31.10.0/24      10.31.10.1      RED 1
!   10.31.20.0/24      10.31.20.1      RED 2
!
! Rutas estaticas:  ip route <red destino> <siguiente salto>
! -> RED 3 (por R2)
ip route 10.31.30.0/24 10.31.255.9
! -> RED 4 (por R2)
ip route 10.31.40.0/24 10.31.255.9
! -> LAN del servidor (CPD) (por R2)
ip route 10.31.100.0/24 10.31.255.9
! -> Enlace R1-R2 (por R2)
ip route 10.31.255.0/29 10.31.255.9
! -> Enlace R2-R4 (por R2)
ip route 10.31.255.16/29 10.31.255.9
!
line vty
!
