! ======================================================================
! FRR (Free Range Routing) - R4: router de acceso de RED 3 y RED 4
! Generado por desplegar_red.py. Se copia a /etc/frr/frr.conf al arrancar.
! ======================================================================
frr defaults traditional
hostname R4
!
! Log en el volumen compartido con fluentd, con milisegundos
log file /shared-volume/frr/R4.log debugging
log timestamp precision 3
!
banner motd line R4 - router de acceso de RED 3 y RED 4 - Practica SDN con Docker (AGR)
!
! Depuracion de zebra: deja en el log las altas y bajas de rutas
debug zebra events
debug zebra rib
!
ip forwarding
!
! Redes directamente conectadas:
!   10.0.3.0/24        10.0.3.2        Enlace R2-R4
!   192.168.3.0/24     192.168.3.1     RED 3
!   192.168.4.0/24     192.168.4.1     RED 4
!
! Rutas estaticas:  ip route <red destino> <siguiente salto>
! -> LAN del servidor (servidor-R1) (por R2)
ip route 10.0.0.0/24 10.0.3.1
! -> Enlace R1-R2 (por R2)
ip route 10.0.1.0/24 10.0.3.1
! -> Enlace R2-R3 (por R2)
ip route 10.0.2.0/24 10.0.3.1
! -> RED 1 (por R2)
ip route 192.168.1.0/24 10.0.3.1
! -> RED 2 (por R2)
ip route 192.168.2.0/24 10.0.3.1
!
line vty
!
