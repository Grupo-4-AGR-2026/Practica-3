# ======================================================================
#  fluentd - recogida de logs del escenario SDN
#  Generado por desplegar_red.py
#  Resultados (en el anfitrion): escenario/fluentd/output/
#     frr/<router>.<fecha>.log      log de FRR de cada router
#     docker/<contenedor>.<fecha>.log  salida de los contenedores
#     fluentd/fluentd.<fecha>.log   log interno de fluentd
# ======================================================================

# --- Entrada 1: driver de logging 'fluentd' de Docker (routers y servidor)
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# --- Entrada: log de FRR de R1 (fichero en el volumen compartido)
<source>
  @type tail
  path /shared-volume/frr/R1.log
  pos_file /shared-volume/frr/fluentd-R1.pos
  tag frr.R1
  read_from_head true
  refresh_interval 5
  <parse>
    @type none
  </parse>
</source>

# --- Entrada: log de FRR de R2 (fichero en el volumen compartido)
<source>
  @type tail
  path /shared-volume/frr/R2.log
  pos_file /shared-volume/frr/fluentd-R2.pos
  tag frr.R2
  read_from_head true
  refresh_interval 5
  <parse>
    @type none
  </parse>
</source>

# --- Entrada: log de FRR de R3 (fichero en el volumen compartido)
<source>
  @type tail
  path /shared-volume/frr/R3.log
  pos_file /shared-volume/frr/fluentd-R3.pos
  tag frr.R3
  read_from_head true
  refresh_interval 5
  <parse>
    @type none
  </parse>
</source>

# --- Entrada: log de FRR de R4 (fichero en el volumen compartido)
<source>
  @type tail
  path /shared-volume/frr/R4.log
  pos_file /shared-volume/frr/fluentd-R4.pos
  tag frr.R4
  read_from_head true
  refresh_interval 5
  <parse>
    @type none
  </parse>
</source>

# --- Salida 1: logs de FRR -> /fluentd/output/frr/<router>.<fecha>.log
<match frr.**>
  @type file
  path /fluentd/output/frr/${tag[1]}
  append true
  <buffer tag,time>
    @type file
    path /fluentd/buffer/frr
    timekey 1d
    timekey_wait 0
    flush_mode interval
    flush_interval 5s
    flush_at_shutdown true
  </buffer>
</match>

# --- Salida 2: salida de los contenedores -> /fluentd/output/docker/<contenedor>.<fecha>.log
<match docker.**>
  @type file
  path /fluentd/output/docker/${tag[1]}
  append true
  <buffer tag,time>
    @type file
    path /fluentd/buffer/docker
    timekey 1d
    timekey_wait 0
    flush_mode interval
    flush_interval 5s
    flush_at_shutdown true
  </buffer>
</match>

# --- Log interno de fluentd -> /fluentd/output/fluentd/fluentd.<fecha>.log
<label @FLUENT_LOG>
  <match fluent.**>
    @type file
    path /fluentd/output/fluentd/fluentd
    append true
    <buffer time>
      @type file
      path /fluentd/buffer/fluent
      timekey 1d
      timekey_wait 0
      flush_mode interval
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>
