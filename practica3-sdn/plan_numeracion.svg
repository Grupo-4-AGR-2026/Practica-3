<text x="30" y="855" font-size="14" class="t" text-anchor="start" font-weight="bold">Notas</text>
<text x="30" y="877" font-size="13" class="s" text-anchor="start" >· Cada switch con VLAN es una red bridge de Docker independiente (br-vlan10 … br-vlan40, br-vlan100); los enlaces son br-enlace12, br-enlace23 y br-enlace24.</text>
<text x="30" y="897" font-size="13" class="s" text-anchor="start" >· El router usa la .1 de cada LAN (en los enlaces, .1 el de arriba y .2 el de abajo); la .254 de cada subred es la del anfitrión Docker.</text>
<text x="30" y="917" font-size="13" class="s" text-anchor="start" >· Servidor: una ruta a cada red de la práctica vía 10.0.0.1 (R1); su ruta por defecto sale a Internet por el anfitrión para clonar el repositorio.</text>
</svg>